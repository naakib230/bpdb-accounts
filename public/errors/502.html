<!doctype html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>সার্ভারের সাথে যোগাযোগে সমস্যা হচ্ছে | BPDB Pay Fixation 2026</title>
    <style>
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; margin: 0; padding: 1.25rem; place-items: center; color: #203345; background: #f3f6f8; font-family: "SolaimanLipi", "Nikosh", "Nirmala UI", "Segoe UI", sans-serif; }
        main { width: min(100%, 40rem); padding: clamp(1.5rem, 5vw, 3rem); text-align: center; background: #fff; border: 1px solid #dce5eb; border-radius: 1.25rem; box-shadow: 0 1rem 2.5rem rgb(32 51 69 / 8%); }
        .brand { margin-bottom: 1.75rem; color: #24476b; font-size: 1.05rem; font-weight: 700; line-height: 1.7; }
        .icon { display: grid; width: 5rem; height: 5rem; margin: 0 auto 1.25rem; place-items: center; color: #a92d37; background: #fdebed; border-radius: 50%; font: 700 2rem/1 "Segoe UI", sans-serif; }
        .code { color: #637789; font-size: .9rem; font-weight: 700; letter-spacing: .08em; }
        h1 { margin: .25rem 0 .9rem; font-size: clamp(1.45rem, 5vw, 2rem); line-height: 1.45; }
        p { color: #526575; font-size: 1rem; line-height: 1.8; }
        nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .65rem; margin-top: 1.5rem; }
        a { min-height: 44px; padding: .65rem 1rem; border: 1px solid #b8c8d5; border-radius: .55rem; color: #24476b; font-weight: 700; text-decoration: none; }
        a.primary { color: #fff; background: #24476b; border-color: #24476b; }
        a:focus-visible { outline: 3px solid #f0b429; outline-offset: 3px; }
        @media (max-width: 575px) { nav { display: grid; } }
    </style>
</head>
<body>
    <main aria-labelledby="error-title">
        <div class="brand">বাংলাদেশ বিদ্যুৎ উন্নয়ন বোর্ড<br>BPDB Pay Fixation 2026</div>
        <div class="icon" aria-hidden="true">!</div>
        <div class="code">HTTP 502</div>
        <h1 id="error-title">সার্ভারের সাথে যোগাযোগে সমস্যা হচ্ছে</h1>
        <p>সিস্টেমের একটি অংশের সাথে সংযোগ করা যাচ্ছে না। কিছুক্ষণ পর আবার চেষ্টা করুন।</p>
        <nav aria-label="সহায়ক লিংক">
            <a class="primary" href="/dashboard">ড্যাশবোর্ডে ফিরে যান</a>
            <a href="/login">লগইন</a>
        </nav>
    </main>
</body>
</html>
